{% macro trailsTabel(trails) %}
<table class="trails-table">
  <thead>
    <tr>
      <th scope="col">Title</th>
      <th scope="col">Description</th>
      <th scope="col">Region</th>
      <th scope="col">Country</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for trail in trails %}
    <tr>
      <td>{{trail.title}}</td>
      <td>{{trail.description|safe}}</td>
      <td>{{trail.region_name}}</td>
      <td>{{trail.region_country}}</td>
      <td>
        <div class="pico-icon-group">
          <button
            type="button"
            class="contrast outline btn-icon"
            aria-label="Edit item"
            data-tooltip="Edit"
            onclick="window.location.href='/admin/form/{{ trail.slug }}'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              ></path>
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              ></path>
            </svg>
          </button>

          <button
            type="button"
            class="btn-delete outline btn-icon"
            aria-label="Delete item"
            data-tooltip="Delete"
            onclick="window.location.href='/admin/delete/{{ trail.id }}'"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <polyline points="3 6 5 6 21 6"></polyline>
              <path
                d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
              ></path>
            </svg>
          </button>
        </div>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endmacro %}
