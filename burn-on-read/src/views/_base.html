<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Express + Bootstrap App</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ExpressApp</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#features">Features</a></li>
          <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="py-5 bg-primary text-white text-center">
    <div class="container px-4">
      <h1 class="display-4 fw-bold">Welcome to Express & Bootstrap</h1>
      <p class="lead">A clean, responsive template running on Node.js and Express.</p>
      <a href="#features" class="btn btn-light btn-lg mt-3">Learn More</a>
    </div>
  </header>

  <!-- Main Content / Cards Section -->
  <main class="container my-5">
    <form action="/submit" method="POST">
    <div class="row g-4">
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea class="form-control" id="message" name="message" rows="3" >
        </textarea>
      </div>
      <div class="mb-3">
        <button type ="submit" class="btn btn-primary w-60">Send</button>
      </div>       
      </div>
    </div>
    </form>
  </main>

  <!-- Footer -->
  <footer class="py-4 bg-light text-white text-center">
    <div class="container">
      <p class="mb-0 text-muted">&copy; 2026 Your App Name. All rights reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JavaScript Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
