name: Cyber Chat CI
on:
  push:
    paths:
      - 'cyber-chat-with-ORM/**'  
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cyber-chat-with-ORM
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./cyber-chat-with-ORM
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: "npm"
      - run: npm ci
      - run: npm run test
